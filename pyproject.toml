[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-probe"
version = "0.1.0"
description = "Smoke-test any MCP server: list its tools, resources and prompts, validate their JSON schemas and call them."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3", "jsonschema>=4.20", "anyio>=4"]
keywords = ["mcp", "model-context-protocol", "testing", "llm", "json-schema"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mcp-probe = "mcp_probe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_probe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
